# XcodeGen spec. Generate the project with: xcodegen generate
# The generated Revive.xcodeproj and Revive/Info.plist are not committed (see app/.gitignore):
# change Info.plist keys only under info.properties below.
name: Revive
options:
  bundleIdPrefix: com.huiw86
  # Simplified Chinese only in M1 (product-spec.md §10); system controls (Back, Copy) follow it.
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  ReviveKit:
    path: ReviveKit
settings:
  base:
    DEVELOPMENT_TEAM: NY89JGE95Q
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Revive:
    type: application
    platform: iOS
    sources: [Revive]
    dependencies:
      - package: ReviveKit
        product: ReviveKit
    info:
      path: Revive/Info.plist
      properties:
        CFBundleDisplayName: 闻笺
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        # Take versions from build settings so TestFlight build numbers can be bumped in one place.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # No third-party brand names in user-facing text (CLAUDE.md rule 5).
        NSBluetoothAlwaysUsageDescription: 连接录音卡，控制录音并把录音同步到手机
        # Asked only after the user turns on on-device transcription (features.md X9).
        # Asked the first time the user records with the phone instead of a card (features.md X18).
        NSMicrophoneUsageDescription: 没有录音卡或录音卡不在身边时，用手机的麦克风录音，保存到本机录音库
        NSSpeechRecognitionUsageDescription: 在这部手机上离线识别语音，无需上传录音
        UIBackgroundModes: [bluetooth-central, audio]
        LSSupportsOpeningDocumentsInPlace: false
        # Audio shared from other apps ("拷贝到闻笺", features.md E2): a copy arrives in the app's
        # Inbox and is imported like a file picked in Files. Alternate: never the default player.
        CFBundleDocumentTypes:
          - CFBundleTypeName: 音频
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
        # The 闻笺 account's server (features.md K1, backend/). Empty: no account anywhere in the app,
        # as until the backend is deployed. Only https is accepted (AppEnvironment.AccountService).
        ReviveAPIBaseURL: ""
        # Export compliance answered in App Store Connect for 0.1.0 (1): standard algorithms only
        # (ChaCha20 to read the card's own audio), not distributed in France; skips the question on later uploads.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huiw86.revive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only: avoids iPad orientation/screenshot requirements; iPad runs it in compatibility mode.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  # The Mac app (ADR-011, features.md X13): a native macOS target sharing ReviveKit and AppModel.
  # Distributed outside the App Store with Developer ID (not sandboxed); M5 step one has no card
  # functions yet, so it asks for no Bluetooth or microphone permission (speech recognition
  # only once 本机转写 is on).
  ReviveMac:
    type: application
    platform: macOS
    sources: [ReviveMac]
    dependencies:
      - package: ReviveKit
        product: ReviveKit
    info:
      path: ReviveMac/Info.plist
      properties:
        CFBundleName: 闻笺
        CFBundleDisplayName: 闻笺
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: 闻笺由独立开发者开发，不是录音卡厂商的官方 App。
        # Asked only after the user turns on 本机转写 in 设置 (features.md X9).
        NSSpeechRecognitionUsageDescription: 在这台 Mac 上把录音转成文字，录音不会离开这台 Mac
    settings:
      base:
        # No third-party brand names (CLAUDE.md rule 5).
        PRODUCT_BUNDLE_IDENTIFIER: com.huiw86.revive.mac
        PRODUCT_NAME: Wenjian
        GENERATE_INFOPLIST_FILE: NO
        # Developer ID distribution needs the hardened runtime for notarization.
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  Revive:
    build:
      targets:
        Revive: all
  ReviveMac:
    build:
      targets:
        ReviveMac: all
