# XcodeGen spec. Generate the project with: xcodegen generate
# The generated Revive.xcodeproj is not committed (see app/.gitignore).
name: Revive
options:
  bundleIdPrefix: com.huiw86
  deploymentTarget:
    iOS: "17.0"
packages:
  ReviveKit:
    path: ReviveKit
settings:
  base:
    DEVELOPMENT_TEAM: NY89JGE95Q
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Revive:
    type: application
    platform: iOS
    sources: [Revive]
    dependencies:
      - package: ReviveKit
        product: ReviveKit
    info:
      path: Revive/Info.plist
      properties:
        CFBundleDisplayName: Revive
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: 连接 D·NOTE 录音卡，控制录音并把录音同步到手机
        UIBackgroundModes: [bluetooth-central, audio]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huiw86.revive
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Revive:
    build:
      targets:
        Revive: all
