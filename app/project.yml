# XcodeGen spec. Generate the project with: xcodegen generate
# The generated Revive.xcodeproj and Revive/Info.plist are not committed (see app/.gitignore):
# change Info.plist keys only under info.properties below.
name: Revive
options:
  bundleIdPrefix: com.huiw86
  # Simplified Chinese only in M1 (product-spec.md §10); system controls (Back, Copy) follow it.
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
packages:
  ReviveKit:
    path: ReviveKit
settings:
  base:
    DEVELOPMENT_TEAM: NY89JGE95Q
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Revive:
    type: application
    platform: iOS
    sources: [Revive]
    dependencies:
      - package: ReviveKit
        product: ReviveKit
    info:
      path: Revive/Info.plist
      properties:
        CFBundleDisplayName: 闻笺
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        # Take versions from build settings so TestFlight build numbers can be bumped in one place.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # No third-party brand names in user-facing text (CLAUDE.md rule 5).
        NSBluetoothAlwaysUsageDescription: 连接录音卡，控制录音并把录音同步到手机
        # Asked only after the user turns on on-device transcription (features.md X9).
        # Asked the first time the user records with the phone instead of a card (features.md X18).
        NSMicrophoneUsageDescription: 没有录音卡或录音卡不在身边时，用手机的麦克风录音；录音只保存在这部手机上
        NSSpeechRecognitionUsageDescription: 在这部手机上把录音转成文字，录音不会离开手机
        UIBackgroundModes: [bluetooth-central, audio]
        LSSupportsOpeningDocumentsInPlace: false
        # Audio shared from other apps ("拷贝到闻笺", features.md E2): a copy arrives in the app's
        # Inbox and is imported like a file picked in Files. Alternate: never the default player.
        CFBundleDocumentTypes:
          - CFBundleTypeName: 音频
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
        # Export compliance answered in App Store Connect for 0.1.0 (1): standard algorithms only
        # (ChaCha20 to read the card's own audio), not distributed in France; skips the question on later uploads.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huiw86.revive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only: avoids iPad orientation/screenshot requirements; iPad runs it in compatibility mode.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Revive:
    build:
      targets:
        Revive: all
