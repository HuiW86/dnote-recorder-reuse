name: client-ci

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "scripts/build_privacy_page.py"
      - "docs/release/privacy-policy.md"
      - "app/project.yml"
      - "app/Revive/Onboarding/InfoPages.swift"
      - "app/ReviveKit/scripts/make_fixtures.py"
      - "app/ReviveKit/Tests/CardProtocolTests/Fixtures/**"
      - "ios-prototype/Tests/Fixtures/**"
      - "ios-prototype/Sources/**"
      - "scripts/check-m1-rules.sh"
      - "scripts/check_evidence.py"
      - "evidence/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    paths:
      - "client/**"
      - "scripts/build_privacy_page.py"
      - "docs/release/privacy-policy.md"
      - "app/project.yml"
      - "app/Revive/Onboarding/InfoPages.swift"
      - "app/ReviveKit/scripts/make_fixtures.py"
      - "app/ReviveKit/Tests/CardProtocolTests/Fixtures/**"
      - "ios-prototype/Tests/Fixtures/**"
      - "ios-prototype/Sources/**"
      - "scripts/check-m1-rules.sh"
      - "scripts/check_evidence.py"
      - "evidence/**"
      - ".github/workflows/client-ci.yml"

# A newer push to the same PR or branch cancels the run it supersedes: only the latest
# commit's result counts.
concurrency:
  group: client-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md rule 1 covers the client and the prototype too (scripts/check-m1-rules.sh).
      - name: M1 static rules
        run: scripts/check-m1-rules.sh

      # CLAUDE.md rule 4: no raw sn, full btaddr or bondId in evidence (ADR-006).
      - name: Evidence redaction
        run: python3 scripts/check_evidence.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r client/requirements.txt pytest

      # Pure-Python tests: no Bluetooth adapter and no card needed.
      - name: pytest
        working-directory: client
        run: pytest
