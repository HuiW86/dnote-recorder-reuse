name: app-ci

on:
  push:
    branches: [main]
    paths: ["app/**", "scripts/check-m1-rules.sh", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["app/**", "scripts/check-m1-rules.sh", ".github/workflows/app-ci.yml"]

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # test-spec.md §3.5 gate 1: forbidden device commands, no networking in M1 modules.
      - name: M1 static rules
        run: scripts/check-m1-rules.sh

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - uses: actions/cache@v4
        with:
          # Cache only the dependency clones; build products depend on the runner's Xcode version.
          path: app/ReviveKit/.build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('app/ReviveKit/Package.resolved') }}

      # Unit and fake-card integration tests run on macOS, no simulator needed.
      - name: ReviveKit tests
        working-directory: app/ReviveKit
        run: swift test --disable-xctest

      - name: Build iOS app
        working-directory: app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project Revive.xcodeproj -scheme Revive \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

  # TEMPORARY (#58 PR 3): remove before merge. Separate jobs so each check's result answers one question.
  temp-plist-identity:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen leaves the committed Info.plist unchanged
        working-directory: app
        run: |
          brew install xcodegen
          xcodegen generate
          git status --short -- Revive/Info.plist
          git diff --exit-code -- Revive/Info.plist

  # Green: with no Info.plist on disk, XcodeGen writes one byte-identical to the committed file.
  temp-plist-fresh:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Info.plist generated from scratch equals the committed one
        working-directory: app
        run: |
          brew install xcodegen
          rm Revive/Info.plist
          xcodegen generate
          test -f Revive/Info.plist
          git status --short -- Revive/Info.plist
          git diff --exit-code -- Revive/Info.plist

  # Green: XcodeGen rewrites an existing plist from project.yml (an extra key does not survive).
  temp-plist-overwrites:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: An extra key in the existing plist is dropped by xcodegen generate
        working-directory: app
        run: |
          brew install xcodegen
          sed -i '' 's|<dict>|<dict><key>TempControlKey</key><string>x</string>|' Revive/Info.plist
          grep -q TempControlKey Revive/Info.plist
          xcodegen generate
          ! grep -q TempControlKey Revive/Info.plist

  temp-phrase-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No document says the multi-card sample is due before the M1 release
        run: |
          set +e
          grep -rn -e "M1 发布前补齐" -e "M1 TestFlight 发布前" --include="*.md" .
          rc=$?
          set -e
          test "$rc" -eq 1
