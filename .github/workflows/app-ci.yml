name: app-ci

on:
  push:
    branches: [main]
    paths: ["app/**", "scripts/check-m1-rules.sh", "scripts/check-theme.sh", "scripts/check-motion.sh", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["app/**", "scripts/check-m1-rules.sh", "scripts/check-theme.sh", "scripts/check-motion.sh", ".github/workflows/app-ci.yml"]

# A newer push to the same PR or branch cancels the run it supersedes: macOS minutes are
# scarce, and only the latest commit's result counts.
concurrency:
  group: app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # test-spec.md §3.5 gate 1: forbidden device commands, no networking in M1 modules.
      - name: M1 static rules
        run: scripts/check-m1-rules.sh

      # design-spec.md §2: views take colours from Theme, not literals (#74).
      - name: Theme colours
        run: scripts/check-theme.sh

      # design-spec.md §2.3: one motion language; views animate only through Motion.swift.
      - name: Motion tokens
        run: scripts/check-motion.sh

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - uses: actions/cache@v4
        with:
          # Cache only the dependency clones; build products depend on the runner's Xcode version.
          path: app/ReviveKit/.build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('app/ReviveKit/Package.resolved') }}

      # Unit and fake-card integration tests run on macOS, no simulator needed.
      - name: ReviveKit tests
        working-directory: app/ReviveKit
        run: swift test --disable-xctest

      # The `revive` command-line tool and MCP server (features.md X19), with the Mac-only audio import.
      - name: Build revive
        working-directory: app/ReviveKit
        run: swift build --product revive

      - name: Build iOS app
        working-directory: app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project Revive.xcodeproj -scheme Revive -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/Revive" \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

      - name: Check the iOS app's bundled privacy manifest
        run: |
          manifest="$RUNNER_TEMP/Revive/Build/Products/Debug-iphonesimulator/Revive.app/PrivacyInfo.xcprivacy"
          plutil -extract NSPrivacyAccessedAPITypes xml1 -o /dev/null "$manifest"

      # ADR-011: the native Mac app shares ReviveKit and AppModel; it must build on every PR too.
      - name: Build Mac app
        working-directory: app
        run: |
          xcodebuild build -project Revive.xcodeproj -scheme ReviveMac \
            -derivedDataPath "$RUNNER_TEMP/Revive" \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
